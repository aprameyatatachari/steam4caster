name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: steam4caster
          POSTGRES_PASSWORD: steam4caster
          POSTGRES_DB: steam4caster_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U steam4caster"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PRICE_PROVIDER: fake
      # Runs the whole suite, including migration tests, against PostgreSQL.
      TEST_DATABASE_URL: postgresql+asyncpg://steam4caster:steam4caster@localhost:5432/steam4caster_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
