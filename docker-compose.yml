# Local development stack. Secrets and feature switches come from `.env`
# (see `.env.example`); the values below only point the app at the Compose services.
x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://steam4caster:steam4caster@postgres:5432/steam4caster
    REDIS_URL: redis://redis:6379/0
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    MODEL_ARTIFACT_PATH: /app/artifacts
  volumes:
    - artifacts:/app/artifacts

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: steam4caster
      POSTGRES_PASSWORD: steam4caster
      POSTGRES_DB: steam4caster
    # Host port 55432, not 5432: a PostgreSQL already installed on the machine often
    # owns 5432 and would silently take the connection instead of this container.
    ports: ["55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steam4caster -d steam4caster"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web inbox at http://localhost:8025

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  artifacts:
