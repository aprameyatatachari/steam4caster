[project]
name = "steam4caster"
version = "0.1.0"
description = "Steam4Caster backend: probabilistic Steam discount forecasts, recommendations, and alerts."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "celery>=5.4",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "pywebpush>=2.0",
    "phonenumbers>=8.13",
    "prometheus-client>=0.21",
    "typer>=0.13",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "joblib>=1.4",
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "aiosqlite>=0.20",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "T20"]
ignore = [
    "B008",   # FastAPI Depends() defaults
    "S101",   # asserts are fine in tests and for narrowing
    "S311",   # random is used for jitter and synthetic demo data, never for secrets
    "RUF012",
    "RUF001", # en dashes and bullets in user-facing text are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "T20", "E501", "ASYNC240", "RUF015", "RUF007", "SIM117"]
"app/cli.py" = ["T20"]
"app/providers/pricing/fake.py" = ["S324"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:lightgbm",
    "ignore::UserWarning:sklearn",
]
markers = [
    "postgres: requires a PostgreSQL instance (TEST_DATABASE_URL or Docker for Testcontainers)",
]
